services:
  claude-proxy:
    # Default to the published GHCR image so users don't need a Go toolchain.
    # Override the tag with CLAUDE_PROXY_IMAGE in .env (e.g. to pin a version
    # like ghcr.io/p4u/claude-proxy:v0.2.0). The `build:` directive below makes
    # `docker compose build` (or `make build`) work for source-tree development.
    image: ${CLAUDE_PROXY_IMAGE:-ghcr.io/p4u/claude-proxy:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: claude-proxy
    restart: unless-stopped
    user: "${PROXY_UID:-65532}:${PROXY_GID:-65532}"
    env_file:
      - .env
    environment:
      # Auth token — read by the binary at startup. Empty disables auth.
      CLAUDE_PROXY_AUTH_TOKEN: "${PROXY_AUTH_TOKEN:-}"
      # Web UI password — read by the binary at startup. Empty disables the
      # UI (/ui/* returns 404). Served on the same port; traefik/TLS above
      # covers it automatically.
      CLAUDE_PROXY_UI_PASSWORD: "${UI_PASSWORD:-}"
      # Force Secure session cookies for the UI. Usually left empty — TLS via
      # traefik is auto-detected from X-Forwarded-Proto.
      CLAUDE_PROXY_UI_SECURE_COOKIES: "${UI_SECURE_COOKIES:-}"
      CLAUDE_PROXY_MODELS_1M: "${MODELS_1M:-}"
      # Days to retain captured user prompts (last user message only, never
      # responses). Default 7; 0 disables prompt capture.
      CLAUDE_PROXY_PROMPT_RETENTION_DAYS: "${PROMPT_RETENTION_DAYS:-}"
      # Private Anthropic-to-Codex sidecar. OAuth material stays in the
      # sidecar's auth volume; this service receives only its internal keys.
      CLAUDE_PROXY_CODEX_BASE_URL: "http://cli-proxy-api:8317"
      CLAUDE_PROXY_CODEX_API_KEY: "${CLIPROXY_API_KEY:-}"
      CLAUDE_PROXY_CODEX_MANAGEMENT_KEY: "${CLIPROXY_MANAGEMENT_KEY:-}"
    ports:
      # When traefik is active (profile=tls), keep this on 127.0.0.1 — traefik
      # reaches the container over the docker network, no host port needed.
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8787}:8787"
    volumes:
      - ./data:/data
      - ./creds:/creds:ro
    networks:
      - default
      - codex-internal
    depends_on:
      - cli-proxy-api
    command:
      - "serve"
      - "--addr"
      - "0.0.0.0:8787"
      - "--db"
      - "/data/proxy.db"
      - "--log-level"
      - "${LOG_LEVEL:-info}"
      - "--log-format"
      - "${LOG_FORMAT:-auto}"
      - "--log-color"
      - "${LOG_COLOR:-auto}"
    healthcheck:
      test: ["CMD", "/usr/local/bin/claude-proxy", "creds", "list", "--db", "/data/proxy.db"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    labels:
      # Traefik routes to this container only when the `tls` profile is active.
      # When traefik isn't running, these labels are harmless.
      - "traefik.enable=true"
      - "traefik.docker.network=claude-proxy_default"
      - "traefik.http.routers.claude-proxy.rule=Host(`${TLS_DOMAIN:-claude-proxy.invalid}`)"
      - "traefik.http.routers.claude-proxy.entrypoints=websecure"
      - "traefik.http.routers.claude-proxy.tls=true"
      - "traefik.http.routers.claude-proxy.tls.certresolver=le"
      - "traefik.http.services.claude-proxy.loadbalancer.server.port=8787"

  cli-proxy-api:
    # Pinned multi-architecture release. Upgrade deliberately and rerun the
    # translator/tool/streaming acceptance tests before changing this digest.
    image: ${CLIPROXY_IMAGE:-eceasy/cli-proxy-api:v7.2.149@sha256:0b6ee7f6e871dbbaa9bb072352f48149b3be05078dc2812c67c4fe1871d7d6ce}
    container_name: claude-proxy-codex
    restart: unless-stopped
    user: "${PROXY_UID:-65532}:${PROXY_GID:-65532}"
    environment:
      CLIPROXY_API_KEY: "${CLIPROXY_API_KEY:-}"
      MANAGEMENT_PASSWORD: "${CLIPROXY_MANAGEMENT_KEY:-}"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        sed "s|__CLIPROXY_API_KEY__|$${CLIPROXY_API_KEY}|g" /config/cliproxy.yaml.tmpl > /tmp/config.yaml
        exec /CLIProxyAPI/CLIProxyAPI -config /tmp/config.yaml
    # OpenAI's registered Codex redirect is fixed to localhost:1455. Publishing
    # it on loopback supports browsers on this host and SSH port forwarding,
    # without exposing the callback listener to the LAN.
    ports:
      - "127.0.0.1:1455:1455"
    volumes:
      - ./config/cliproxy.yaml.tmpl:/config/cliproxy.yaml.tmpl:ro
      - ./data/cliproxy-auth:/auth
    networks:
      - codex-internal
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  traefik:
    image: traefik:latest
    container_name: claude-proxy-traefik
    restart: unless-stopped
    # Activated only when COMPOSE_PROFILES contains "tls" (the Makefile sets
    # this automatically whenever TLS_DOMAIN is non-empty in .env).
    profiles:
      - tls
    depends_on:
      - claude-proxy
    command:
      - "--log.level=${TRAEFIK_LOG_LEVEL:-INFO}"
      - "--accesslog=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=claude-proxy_default"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.web.http.redirections.entrypoint.permanent=true"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.le.acme.tlschallenge=true"
      - "--certificatesresolvers.le.acme.email=${TLS_EMAIL}"
      - "--certificatesresolvers.le.acme.caserver=${TLS_CASERVER:-https://acme-v02.api.letsencrypt.org/directory}"
      - "--certificatesresolvers.le.acme.storage=/letsencrypt/acme.json"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./data/letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro

  watchtower:
    image: nickfedor/watchtower:latest
    container_name: claude-proxy-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: claude-proxy --interval 300 --cleanup

networks:
  codex-internal:
    # Dedicated bridge: only claude-proxy and the sidecar join it. It must keep
    # normal outbound NAT so CLIProxyAPI can reach OpenAI OAuth/model services.
    driver: bridge
